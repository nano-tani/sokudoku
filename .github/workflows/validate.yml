name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check vendor/budoux/budoux-ja.js

      - name: Check BudouX segmentation
        run: |
          node - <<'NODE'
          require("./vendor/budoux/budoux-ja.js");
          const parser = globalThis.BudouXJapaneseParser;
          if (!parser || parser.version !== "0.9.1") {
            throw new Error("BudouX parser is unavailable");
          }
          const chunks = parser.parse("今日は天気です。");
          if (chunks.join("|") !== "今日は|天気です。") {
            throw new Error("Unexpected BudouX output: " + chunks.join("|"));
          }
          NODE

      - name: Check catalog builder syntax
        run: python -m py_compile scripts/build_catalog.py

      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s vendor/budoux/budoux-ja.js
          test -s vendor/budoux/LICENSE
          test -s scripts/build_catalog.py
