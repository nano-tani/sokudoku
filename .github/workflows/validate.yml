name: Validate static site

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check catalog builder syntax
        run: python -m py_compile scripts/build_catalog.py

      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s scripts/build_catalog.py
